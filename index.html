    <script type="application/ld+json">

      "description": "Search research papers by DOI, title, or author. Search beyond every paywall.",

        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://kumo.saishankar.xyz/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        "https://github.com/saishankar404/kumo"

    }
